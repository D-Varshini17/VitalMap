name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/**'
      - 'vercel.json'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/**'
      - 'vercel.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze
      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Build production Web
        working-directory: frontend
        run: flutter build web --release
      - name: Load test production Web build
        run: node scripts/load_test.cjs
      - name: Build Android release
        working-directory: frontend
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vitalmap-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: frontend
          script: flutter test integration_test/mobile_smoke_test.dart -d emulator-5554
      - name: Appium Flutter Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            mkdir -p artifacts/test-reports/appium
            npm install --no-save webdriverio
            npm install -g appium
            appium driver install uiautomator2
            appium --base-path / > artifacts/test-reports/appium/appium-server.log 2>&1 &
            sleep 20
            node scripts/appium_flutter_smoke.cjs
      - name: Prepare security report directory
        if: always()
        run: mkdir -p artifacts/test-reports/security
      - name: Vulnerability scan
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: artifacts/test-reports/security/trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: 0
      - name: Generate master test report
        if: always()
        run: node scripts/generate_master_test_report.cjs
      - name: Upload master test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitalmap-master-test-report
          path: artifacts/test-reports
