name: vitalmap
description: VitalMap - organ health risk indicator (Flutter frontend)
publish_to: 'none'
version: 0.1.1+2
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.5
  shared_preferences: ^2.0.15
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo_medid.jpeg
    - assets/images/organs/
    - assets/organs/images/
    - assets/images/logo/

# Launcher icons (will be regenerated from the padded/foreground images)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo/app_icon_padded.png"
  adaptive_icon_background: "#F8FBFF"
  adaptive_icon_foreground: "assets/images/logo/app_icon_foreground.png"
  min_sdk_android: 23
